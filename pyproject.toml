[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "login-wallpaper-selector"
version = "1.5.0"
description = "A modular desktop utility suite featuring intelligent Wallpaper Management and offline Download Folder Organizing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Login Wallpaper Selector Team" }
]

dependencies = [
    "httpx>=0.24.0",
    "pillow>=9.0.0",
    "platformdirs>=3.0.0",
    "customtkinter>=5.2.0; platform_system=='Windows' or platform_system=='Linux' or platform_system=='Darwin'",
    "pywin32>=305; platform_system=='Windows'",
    "pystray>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/ashugit1234622/wallpaper-selector"
Repository = "https://github.com/ashugit1234622/wallpaper-selector"
Issues = "https://github.com/ashugit1234622/wallpaper-selector/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
login-wallpaper-selector = "login_wallpaper_selector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
